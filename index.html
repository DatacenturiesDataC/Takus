<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takus — Free Screen Recorder with Google Drive</title>
    <meta name="description" content="Record your screen. Save directly to Google Drive. Free forever. No installs, no accounts, no meeting bots." />
    <meta name="theme-color" content="#0a0a1a" />
    <meta property="og:title" content="Takus — Free Screen Recorder" />
    <meta property="og:description" content="Record any screen or video call. Auto-upload to your Google Drive. Zero cost." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><polygon points='38,25 38,75 78,50' fill='white'/></svg>" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Google API Config: Replace with your Client ID -->
    <script>
      window.__TAKUS_CONFIG__ = {
        google: {
          clientId: 'YOUR_CLIENT_ID.apps.googleusercontent.com',
        },
        drive: {
          folderName: 'Takus Recordings',
          makePublic: false,
        },
        calendar: {
          enabled: true,
        },
      };
    </script>

    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
