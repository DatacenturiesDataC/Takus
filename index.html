<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://login.microsoftonline.com" crossorigin />
    <link rel="preconnect" href="https://graph.microsoft.com" crossorigin />
    <title>Takus — Free Screen Recorder with Cloud Storage</title>
    <meta name="description" content="Record your screen. Save directly to Google Drive or OneDrive. Free forever. No installs, no accounts, no meeting bots." />
    <meta name="theme-color" content="#7c3aed" />
    <meta property="og:title" content="Takus — Free Screen Recorder" />
    <meta property="og:description" content="Record any screen or video call. Auto-upload to your Google Drive. Zero cost." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://takus.netlify.app/" />
    <meta property="og:site_name" content="Takus" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Takus — Free Screen Recorder" />
    <meta name="twitter:description" content="Record any screen or video call. Auto-upload to your Google Drive. Zero cost." />
    <link rel="canonical" href="https://takus.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Takus",
      "url": "https://takus.netlify.app",
      "description": "Free screen recorder that saves directly to Google Drive. No installs, no accounts, no meeting bots.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "browserRequirements": "Requires a modern browser with MediaRecorder API support"
    }
    </script>
  </head>
  <body>
    <a href="#app" class="sr-only" style="position:fixed;top:-100%;left:50%;transform:translateX(-50%);z-index:9999;padding:0.75rem 1.5rem;background:#7c3aed;color:#fff;border-radius:0 0 8px 8px;font-weight:600;text-decoration:none;transition:top 0.2s;" onfocus="this.style.top='0'" onblur="this.style.top='-100%'">Skip to content</a>
    <div id="app">
      <!-- Loading skeleton — shown until JS hydrates -->
      <div style="max-width:1100px;margin:0 auto;padding:1.5rem;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;margin-bottom:1.5rem;">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#3b82f6);"></div>
            <div style="width:60px;height:20px;border-radius:6px;background:rgba(255,255,255,0.06);"></div>
          </div>
          <div style="width:120px;height:28px;border-radius:99px;background:rgba(255,255,255,0.04);"></div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:3rem;text-align:center;">
          <div style="width:64px;height:64px;border-radius:16px;background:rgba(124,58,237,0.15);margin:0 auto 1.5rem;"></div>
          <div style="width:260px;height:28px;border-radius:8px;background:rgba(255,255,255,0.06);margin:0 auto 1rem;"></div>
          <div style="width:380px;height:16px;border-radius:6px;background:rgba(255,255,255,0.04);margin:0 auto;"></div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="text-align:center;padding:4rem 2rem;color:#94a3b8;font-family:Inter,sans-serif;">
        <h1 style="color:#f1f5f9;">Takus requires JavaScript</h1>
        <p>Please enable JavaScript in your browser to use this screen recorder.</p>
      </div>
    </noscript>

    <!-- Google API Config: Replace with your Client ID -->
    <script>
      window.__TAKUS_CONFIG__ = {
        google: {
          clientId: '355589548775-lq746fgnon7krulr18lv1tt7avall91c.apps.googleusercontent.com',
        },
        drive: {
          folderName: 'Takus Recordings',
          makePublic: false,
        },
        calendar: {
          enabled: true,
        },
        microsoft: {
          clientId: '', // Set your Microsoft Entra Application (client) ID here
        },
      };
    </script>

    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Resolve relative to the current page so the worker scope matches the
          // deployment sub-path (e.g. /Takus/ on GitHub Pages).
          const swUrl = new URL('./sw.js', document.baseURI).href;
          navigator.serviceWorker.register(swUrl).catch((err) => {
            console.warn('[Takus] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
