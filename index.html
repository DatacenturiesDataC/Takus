<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takus — Free Screen Recorder with Google Drive</title>
    <meta name="description" content="Record your screen. Save directly to Google Drive. Free forever. No installs, no accounts, no meeting bots." />
    <meta name="theme-color" content="#0a0a1a" />
    <meta property="og:title" content="Takus — Free Screen Recorder" />
    <meta property="og:description" content="Record any screen or video call. Auto-upload to your Google Drive. Zero cost." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Google API Config: Replace with your Client ID -->
    <script>
      window.__TAKUS_CONFIG__ = {
        google: {
          clientId: 'YOUR_CLIENT_ID.apps.googleusercontent.com',
        },
        drive: {
          folderName: 'Takus Recordings',
          makePublic: false,
        },
        calendar: {
          enabled: true,
        },
      };
    </script>

    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Resolve relative to the current page so the worker scope matches the
          // deployment sub-path (e.g. /Takus/ on GitHub Pages).
          const swUrl = new URL('./sw.js', document.baseURI).href;
          navigator.serviceWorker.register(swUrl).catch((err) => {
            console.warn('[Takus] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
