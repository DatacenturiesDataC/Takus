[build]
  publish = "dist"
  command = "npm test && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api/* to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback — all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
